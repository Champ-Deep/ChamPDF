pid /etc/nginx/tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }
    default_type application/octet-stream;

    gzip_static on;
    
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 9;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/wasm application/x-javascript text/x-component;

    server {
        listen 8080;
        listen [::]:8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # =================================================================
        # API REVERSE PROXY - Forward /api/* requests to FastAPI backend.
        # BACKEND_URL is substituted at container start by the nginx
        # envsubst entrypoint (see Dockerfile). When no backend is
        # configured it points at localhost:8000 and proxy attempts
        # surface as 502 (rather than nginx serving index.html on POST,
        # which would return a misleading 405).
        # =================================================================
        location /api/ {
            proxy_pass ${BACKEND_URL};
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_buffering off;
            proxy_request_buffering off;

            client_max_body_size 100M;
        }

        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
        }

        location ~* /libreoffice-wasm/soffice\.wasm\.gz$ {
            gzip off;
            types {} default_type application/wasm;
            add_header Content-Encoding gzip;
            add_header Vary "Accept-Encoding";
            add_header Cache-Control "public, immutable";
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
        }

        location ~* /libreoffice-wasm/soffice\.data\.gz$ {
            gzip off;
            types {} default_type application/octet-stream;
            add_header Content-Encoding gzip;
            add_header Vary "Accept-Encoding";
            add_header Cache-Control "public, immutable";
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
        }

        location ~* \.(wasm|wasm\.gz|data|data\.gz)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
        }

        location ~* \.(js|mjs|css|woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
        }

        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|mp4|webm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.json$ {
            expires 1w;
            add_header Cache-Control "public, must-revalidate";
        }

        location ~* \.pdf$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~ ^/(en|de|es|zh|zh-TW|vi|it|id|tr|fr|pt)(/.*)?$ {
            try_files $uri $uri/ $uri.html /$1/index.html /index.html;
            expires 5m;
            add_header Cache-Control "public, must-revalidate";
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
        }

        location ~ ^/(.+?)/(en|de|es|zh|zh-TW|vi|it|id|tr|fr|pt)(/.*)?$ {
            try_files $uri $uri/ $uri.html /$1/$2/index.html /$1/index.html /index.html;
            expires 5m;
            add_header Cache-Control "public, must-revalidate";
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
        }

        location / {
            try_files $uri $uri/ $uri.html /index.html;
            expires 5m;
            add_header Cache-Control "public, must-revalidate";
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
        }

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }
}
