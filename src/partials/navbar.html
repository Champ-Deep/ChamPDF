{{#if simpleMode}} {{> navbar-simple}} {{else}}
<nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-30">
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center h-16">
      <div
        class="flex-shrink-0 flex items-center cursor-pointer"
        id="home-logo"
      >
        <svg
          class="h-8 w-8"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="ChamPDF Logo"
        >
          <path
            d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
            fill="#FF6B35"
          />
          <path
            d="m8.8 12 2 2 4.4-4.4"
            stroke="#fff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
          />
        </svg>
        <span
          class="text-white font-bold text-xl ml-2"
          style="font-family: var(--font-display)"
        >
          <a href="index.html">Cham<span class="text-orange-500">PDF</span></a>
        </span>
      </div>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center space-x-1">
        <!-- Documents pillar -->
        <div class="pillar-dropdown-wrapper relative">
          <button
            class="pillar-nav-btn nav-link flex items-center gap-1.5"
            data-pillar="documents"
            aria-expanded="false"
            aria-haspopup="true"
          >
            <i data-lucide="file-text" class="w-4 h-4"></i>
            <span class="hidden lg:inline" data-i18n="nav.documents"
              >Documents</span
            >
            <i
              data-lucide="chevron-down"
              class="w-3 h-3 opacity-60 pillar-chevron-icon transition-transform duration-200"
            ></i>
          </button>
          <div class="mega-menu" id="mega-menu-documents" role="menu">
            <!-- Populated by mobileMenu.ts -->
          </div>
        </div>

        <!-- Images pillar -->
        <div class="pillar-dropdown-wrapper relative">
          <button
            class="pillar-nav-btn nav-link flex items-center gap-1.5"
            data-pillar="images"
            aria-expanded="false"
            aria-haspopup="true"
          >
            <i data-lucide="image" class="w-4 h-4"></i>
            <span class="hidden lg:inline" data-i18n="nav.images">Images</span>
            <i
              data-lucide="chevron-down"
              class="w-3 h-3 opacity-60 pillar-chevron-icon transition-transform duration-200"
            ></i>
          </button>
          <div class="mega-menu" id="mega-menu-images" role="menu">
            <!-- Populated by mobileMenu.ts -->
          </div>
        </div>

        <!-- Video pillar -->
        <div class="pillar-dropdown-wrapper relative">
          <button
            class="pillar-nav-btn nav-link flex items-center gap-1.5"
            data-pillar="video"
            aria-expanded="false"
            aria-haspopup="true"
          >
            <i data-lucide="video" class="w-4 h-4"></i>
            <span class="hidden lg:inline" data-i18n="nav.video">Video</span>
            <i
              data-lucide="chevron-down"
              class="w-3 h-3 opacity-60 pillar-chevron-icon transition-transform duration-200"
            ></i>
          </button>
          <div class="mega-menu" id="mega-menu-video" role="menu">
            <!-- Populated by mobileMenu.ts -->
          </div>
        </div>

        <!-- Divider -->
        <div class="w-px h-5 bg-gray-600 mx-2"></div>

        <!-- Signatures -->
        <button
          id="open-signatures-btn"
          class="nav-link flex items-center gap-1.5"
          title="My Signatures"
        >
          <i data-lucide="pen-tool" class="w-4 h-4"></i>
          <span class="hidden lg:inline">Signatures</span>
        </button>

        <!-- User Account Area -->
        <div id="user-account-area" class="flex items-center">
          <button
            id="login-btn"
            class="nav-link flex items-center gap-1.5"
            title="Sign In"
          >
            <i data-lucide="log-in" class="w-4 h-4"></i>
            <span class="hidden lg:inline">Sign In</span>
          </button>

          <div id="user-menu" class="hidden relative">
            <button
              id="user-menu-btn"
              class="flex items-center gap-2 p-1 rounded-full hover:bg-gray-700 transition-colors"
            >
              <div
                class="w-8 h-8 rounded-full bg-orange-600 flex items-center justify-center text-white text-sm font-medium"
              >
                <span id="user-initial">?</span>
              </div>
            </button>
            <div
              id="user-dropdown"
              class="hidden absolute right-0 mt-2 w-48 bg-gray-700 rounded-lg shadow-xl py-2 border border-gray-600 z-50"
            >
              <p
                class="px-4 py-2 text-sm text-gray-300 border-b border-gray-600 truncate"
                id="user-email"
              ></p>
              <button
                id="logout-btn"
                class="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-gray-600 transition-colors"
              >
                Sign Out
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Mobile Hamburger Button -->
      <div class="md:hidden flex items-center">
        <button
          id="mobile-menu-button"
          type="button"
          class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-red-500 transition-colors"
          aria-controls="mobile-menu"
          aria-expanded="false"
        >
          <span class="sr-only" data-i18n="nav.openMainMenu"
            >Open main menu</span
          >
          <svg
            id="menu-icon"
            class="block h-6 w-6"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
          <svg
            id="close-icon"
            class="hidden h-6 w-6"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu Dropdown -->
  <div
    id="mobile-menu"
    class="hidden md:hidden bg-gray-800 border-t border-gray-700"
  >
    <div class="px-2 pt-2 pb-3">
      <!-- Documents accordion -->
      <div class="mobile-pillar-section">
        <button
          class="mobile-pillar-toggle w-full flex items-center justify-between px-3 py-2 text-gray-300 hover:text-white hover:bg-gray-700 rounded-md transition-colors"
        >
          <span class="flex items-center gap-2 text-base font-medium">
            <i data-lucide="file-text" class="w-4 h-4 text-orange-400"></i>
            <span data-i18n="nav.documents">Documents</span>
          </span>
          <i
            data-lucide="chevron-down"
            class="w-4 h-4 pillar-chevron transition-transform duration-200"
          ></i>
        </button>
        <div
          class="mobile-pillar-content overflow-hidden"
          style="max-height: 0"
        >
          <div id="mobile-pillar-tools-documents" class="pl-4 pb-2 space-y-1">
            <!-- Populated by mobileMenu.ts -->
          </div>
        </div>
      </div>

      <!-- Images accordion -->
      <div class="mobile-pillar-section">
        <button
          class="mobile-pillar-toggle w-full flex items-center justify-between px-3 py-2 text-gray-300 hover:text-white hover:bg-gray-700 rounded-md transition-colors"
        >
          <span class="flex items-center gap-2 text-base font-medium">
            <i data-lucide="image" class="w-4 h-4 text-orange-400"></i>
            <span data-i18n="nav.images">Images</span>
          </span>
          <i
            data-lucide="chevron-down"
            class="w-4 h-4 pillar-chevron transition-transform duration-200"
          ></i>
        </button>
        <div
          class="mobile-pillar-content overflow-hidden"
          style="max-height: 0"
        >
          <div id="mobile-pillar-tools-images" class="pl-4 pb-2 space-y-1">
            <!-- Populated by mobileMenu.ts -->
          </div>
        </div>
      </div>

      <!-- Video accordion -->
      <div class="mobile-pillar-section">
        <button
          class="mobile-pillar-toggle w-full flex items-center justify-between px-3 py-2 text-gray-300 hover:text-white hover:bg-gray-700 rounded-md transition-colors"
        >
          <span class="flex items-center gap-2 text-base font-medium">
            <i data-lucide="video" class="w-4 h-4 text-orange-400"></i>
            <span data-i18n="nav.video">Video</span>
          </span>
          <i
            data-lucide="chevron-down"
            class="w-4 h-4 pillar-chevron transition-transform duration-200"
          ></i>
        </button>
        <div
          class="mobile-pillar-content overflow-hidden"
          style="max-height: 0"
        >
          <div id="mobile-pillar-tools-video" class="pl-4 pb-2 space-y-1">
            <!-- Populated by mobileMenu.ts -->
          </div>
        </div>
      </div>

      <!-- Divider -->
      <div class="border-t border-gray-700 mt-2 pt-2 space-y-1">
        <button
          id="open-signatures-btn-mobile"
          class="mobile-nav-link w-full flex items-center justify-center gap-2"
        >
          <i data-lucide="pen-tool" class="w-4 h-4"></i>
          Signatures
        </button>

        <div id="user-account-area-mobile">
          <button
            id="login-btn-mobile"
            class="mobile-nav-link w-full flex items-center justify-center gap-2"
          >
            <i data-lucide="log-in" class="w-4 h-4"></i>
            Sign In
          </button>

          <div id="user-menu-mobile" class="hidden">
            <div class="flex items-center justify-center gap-2 py-2">
              <div
                class="w-8 h-8 rounded-full bg-orange-600 flex items-center justify-center text-white text-sm font-medium"
              >
                <span id="user-initial-mobile">?</span>
              </div>
            </div>
            <button
              id="logout-btn-mobile"
              class="mobile-nav-link w-full flex items-center justify-center gap-2 text-red-400"
            >
              <i data-lucide="log-out" class="w-4 h-4"></i>
              Sign Out
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>
{{/if}}

<!-- Include Auth Modal -->
{{> auth-modal }}
