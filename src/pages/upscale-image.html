<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>AI Image Upscaler - Enlarge Images 2x/4x | ChamPDF</title>
    <meta
      name="title"
      content="AI Image Upscaler - Enlarge Images 2x/4x | ChamPDF"
    />
    <meta
      name="description"
      content="★ Upscale and enhance images with Real-ESRGAN AI ★ 2x and 4x super-resolution ★ Sharpen logos, photos and video frames ★ Privacy-first"
    />
    <meta
      name="keywords"
      content="image upscaler, ai super resolution, real-esrgan, enlarge image, enhance image"
    />
    <meta name="author" content="ChamPDF" />
    <meta name="robots" content="index, follow" />

    <link href="/src/css/styles.css" rel="stylesheet" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
  </head>

  <body class="antialiased bg-gray-900">
    {{> navbar }}

    <div
      id="uploader"
      class="min-h-screen flex flex-col items-center justify-start py-12 p-4 bg-gray-900"
    >
      <div
        id="tool-uploader"
        class="bg-gray-800 rounded-xl shadow-xl px-4 py-8 md:p-8 max-w-2xl w-full text-gray-200 border border-gray-700"
      >
        <button
          id="back-to-tools"
          class="flex items-center gap-2 text-orange-400 hover:text-orange-300 mb-6 font-semibold"
        >
          <i data-lucide="arrow-left" class="cursor-pointer"></i>
          <span class="cursor-pointer" data-i18n="tools:backToTools"
            >Back to Tools</span
          >
        </button>

        <h1
          class="text-2xl font-bold text-white mb-2"
          data-i18n="tools:upscaleImage.name"
        >
          AI Image Upscaler
        </h1>
        <p class="text-gray-400 mb-6" data-i18n="tools:upscaleImage.subtitle">
          Enlarge and enhance images up to 4x with Real-ESRGAN super-resolution.
        </p>

        <!-- Drop zone -->
        <div
          id="drop-zone"
          class="relative flex flex-col items-center justify-center w-full h-48 md:h-64 border-2 border-dashed border-gray-600 rounded-xl cursor-pointer bg-gray-900 hover:bg-gray-700 transition-colors duration-300"
        >
          <div
            class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-4"
          >
            <i
              data-lucide="image-up"
              class="w-10 h-10 mb-3 text-orange-400"
            ></i>
            <p class="mb-2 text-sm text-gray-400">
              <span class="font-semibold">Click to select an image</span>
              <span>or drag and drop</span>
            </p>
            <p class="text-xs text-gray-500">
              Supports PNG, JPG, WebP (Max 10MB)
            </p>
          </div>
          <input
            id="file-input"
            type="file"
            class="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer"
            accept=".png,.jpg,.jpeg,.webp"
          />
        </div>

        <div id="file-display-area" class="mt-4 space-y-2"></div>

        <!-- Options -->
        <div id="options-section" class="hidden mt-6 space-y-6">
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-3"
              >Upscale factor</label
            >
            <div class="grid grid-cols-2 gap-3">
              <label class="relative cursor-pointer">
                <input
                  type="radio"
                  name="scale"
                  value="2"
                  class="peer sr-only"
                />
                <div
                  class="flex flex-col items-center gap-1 p-4 rounded-lg border-2 border-gray-700 hover:border-orange-500/50 transition-colors peer-checked:border-orange-500 peer-checked:bg-orange-500/10"
                >
                  <span class="text-white font-semibold text-lg">2x</span>
                  <span class="text-xs text-gray-400">Faster</span>
                </div>
              </label>
              <label class="relative cursor-pointer">
                <input
                  type="radio"
                  name="scale"
                  value="4"
                  class="peer sr-only"
                  checked
                />
                <div
                  class="flex flex-col items-center gap-1 p-4 rounded-lg border-2 border-gray-700 hover:border-orange-500/50 transition-colors peer-checked:border-orange-500 peer-checked:bg-orange-500/10"
                >
                  <span class="text-white font-semibold text-lg">4x</span>
                  <span class="text-xs text-gray-400">Highest detail</span>
                </div>
              </label>
            </div>
          </div>

          <button
            id="process-btn"
            class="w-full bg-orange-600 hover:bg-orange-500 text-white px-6 py-4 rounded-lg font-medium transition-colors flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <i data-lucide="sparkles" class="w-5 h-5"></i>
            Upscale Image
          </button>
        </div>

        <!-- Processing -->
        <div id="processing-status" class="hidden mt-6">
          <div class="bg-gray-900 p-5 rounded-lg border border-gray-700">
            <div class="flex items-center gap-3 mb-3">
              <div class="solid-spinner"></div>
              <div>
                <p id="status-text" class="text-white font-medium">
                  Upscaling...
                </p>
                <p id="status-detail" class="text-gray-400 text-sm">
                  Enhancing on the server
                </p>
              </div>
            </div>
            <div class="w-full bg-gray-700 rounded-full h-2">
              <div
                id="progress-bar"
                class="bg-orange-500 h-2 rounded-full transition-all duration-300"
                style="width: 0%"
              ></div>
            </div>
          </div>
        </div>

        <!-- Download -->
        <div id="download-section" class="hidden mt-6 space-y-4 text-center">
          <div
            class="bg-gray-900 p-6 rounded-xl border border-gray-700 flex flex-col items-center"
          >
            <p
              class="text-green-400 font-medium mb-4 flex items-center gap-2 text-lg"
            >
              <i data-lucide="check-circle" class="w-6 h-6"></i>
              <span>Image upscaled successfully!</span>
            </p>
            <div class="flex flex-col sm:flex-row gap-4 w-full">
              <button
                id="download-btn"
                class="flex-1 btn bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 px-6 rounded-xl flex items-center justify-center gap-2"
              >
                <i data-lucide="download"></i>
                Download Image
              </button>
              <button
                id="process-another-btn"
                class="flex-1 btn bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-xl flex items-center justify-center gap-2"
              >
                <i data-lucide="refresh-cw"></i>
                Upscale another
              </button>
            </div>
          </div>
        </div>

        <!-- Error -->
        <div id="error-section" class="hidden mt-6">
          <div class="bg-red-900/20 border border-red-700 p-5 rounded-lg">
            <div class="flex items-center gap-2 mb-2">
              <i data-lucide="alert-circle" class="w-5 h-5 text-red-400"></i>
              <p class="text-red-400 font-medium">Something went wrong</p>
            </div>
            <p id="error-message" class="text-red-400/80 text-sm"></p>
          </div>
          <button
            id="try-again-btn"
            class="mt-4 w-full bg-gray-700 hover:bg-gray-600 text-white px-6 py-3 rounded-lg font-medium transition-colors"
          >
            Try Again
          </button>
        </div>
      </div>
    </div>

    <!-- Alert Modal (used by showAlert) -->
    <div
      id="alert-modal"
      class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4"
    >
      <div
        class="bg-gray-800 p-6 rounded-lg border border-gray-700 shadow-xl max-w-sm w-full"
      >
        <h3 id="alert-title" class="text-xl font-bold text-white mb-2">
          Notice
        </h3>
        <p id="alert-message" class="text-gray-300 mb-6"></p>
        <button
          id="alert-ok"
          class="w-full bg-orange-600 hover:bg-orange-500 text-white px-4 py-2 rounded-lg font-medium"
        >
          OK
        </button>
      </div>
    </div>

    {{> footer }}

    <script type="module" src="/src/js/utils/lucide-init.ts"></script>
    <script type="module" src="/src/js/utils/full-width.ts"></script>
    <script type="module" src="/src/js/utils/simple-mode-footer.ts"></script>
    <script type="module" src="/src/version.ts"></script>
    <script type="module" src="/src/js/logic/upscale-image-page.ts"></script>
    <script type="module" src="/src/js/mobileMenu.ts"></script>
    <script type="module" src="/src/js/main.ts"></script>
  </body>
</html>
